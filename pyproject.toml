[project]
name = "desktop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samuel Botina", email = "samuelmusic4s@gmail.com" },
    { name = "Manuel Aguirre", email = "manuelaguirre3123@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.2",
    "pyside6>=6.8",
    "sqlalchemy>=2.0",
]

[tool.uv.build-backend]
module-name = ["desktop", "modules"]

[project.scripts]
desktop = "desktop:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
